spring:
  application:
    name: filedrop-backend
  datasource:
    url: jdbc:h2:file:~/filedropdb
    username: sa
    password: 1111
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
app:
  upload:
    directory: uploads